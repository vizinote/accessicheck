services:
  accessicheck-api:
    build: ./api
    container_name: accessicheck-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - accessicheck-data:/data
      - /opt/data/badgeia-mail.env:/app/badgeia-mail.env:ro
    environment:
      - DATABASE_PATH=/data/scans.db
      - SCAN_TIMEOUT=30000
      - MAX_RETRIES=2
      - WORKER_SCAN_TIMEOUT_MS=90000
      - MULTIPAGE_SCAN_TIMEOUT_MS=420000
      - PORT=8080
      - BASE_PATH=
      - SCANNER_LLM_MODEL=deepseek/deepseek-v4-flash-0731
      - SCANNER_LLM_TIMEOUT_MS=25000
    networks:
      - badgeia-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  accessicheck-data:

networks:
  badgeia-net:
    external: true
